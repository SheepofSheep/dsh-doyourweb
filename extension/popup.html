<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH DoYourWeb</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <h1>DSH DoYourWeb</h1>
    <label class="connection-toggle"><input id="enabled" type="checkbox">连接 DSH</label>
    <output id="status" aria-live="polite">正在检查连接…</output>
    <p id="compatibility" class="hint" role="status" hidden></p>
  </header>
  <div class="row utility-actions">
    <button id="annotate" class="primary" disabled>批注当前页面</button>
    <button id="manage">应用管理</button>
  </div>
  <button id="stop-operation" class="quiet" disabled>停止当前页操作</button>
  <p id="page-feedback" class="hint" role="status" hidden></p>
  <div id="pairing" hidden>
    <p class="hint">在 DSH 输入 /browser 打开连接设置，核对验证码后点击“允许”完成配对。</p>
    <code id="code"></code>
  </div>
  <button id="setup">查看连接状态</button>
  <details class="connection-settings">
    <summary>连接设置</summary>
    <div class="row">
      <label for="port">DSH 端口</label>
      <input id="port" type="number" min="1" max="65535">
      <button id="save-port">保存</button>
    </div>
    <div class="row"><button id="unpair" hidden>解除配对</button></div>
    <p class="hint" id="file-access"></p>
    <p class="hint" id="version"></p>
  </details>
</body>
</html>
